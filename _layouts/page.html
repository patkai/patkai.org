---
layout: default
---

<article class="page fade-in-up">
  <header class="page-header">
    {% if page.title %}
    <h1>{{ page.title }}</h1>
    {% endif %}
    {% if page.description %}
    <p class="text-muted">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</article>
